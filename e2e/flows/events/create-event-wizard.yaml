appId: com.vascoandco.vasco.ios
name: Events — parcours critique de création guidée
---
- runFlow: ../auth/login.yaml

- tapOn: "Agenda"
- assertVisible: "Aujourd’hui"
- tapOn: "Créer"
- tapOn: "Événement"
- assertVisible: "Comment souhaitez-vous commencer ?"
- tapOn: "Création guidée"
- assertVisible: "Que souhaitez-vous organiser ?"
- tapOn: "Soins"

- assertVisible: "Étape 2 sur 4"
- tapOn: "Intitulé des soins"
- inputText: "Vermifuge Maestro"
- hideKeyboard
- tapOn: "Date, Choisir une date"
- tapOn: "15"
- tapOn: "Confirmer"
- tapOn: "Choisir les animaux"

- assertVisible: "Étape 3 sur 4"
- tapOn:
    id: "event-animal-.*"
    index: 0
- tapOn:
    id: "event-animals-continue"

- assertVisible: "Étape 4 sur 4"
- tapOn: "Enregistrer l’événement"
- extendedWaitUntil:
    visible: "Événement enregistré"
    timeout: 20000
- assertVisible: "Vermifuge Maestro"
- tapOn: "Voir dans l’agenda"
- assertVisible: "Agenda"
