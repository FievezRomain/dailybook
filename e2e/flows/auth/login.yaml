appId: com.vascoandco.vasco.ios
name: Login - successful authentication
---
- launchApp:
    clearState: true

- assertVisible: "Se connecter"

- tapOn:
    id: "input-email"
- inputText: ${TEST_EMAIL}

- tapOn:
    id: "input-password"
- inputText: ${TEST_PASSWORD}

- tapOn: "Se connecter"

- assertVisible: "Tableau de bord"
